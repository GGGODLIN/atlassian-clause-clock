modules:
  jira:issuePanel:
    - key: clause-clock-issue-panel
      resource: clause-clock-ui
      resolver:
        function: clause-clock-router
      title: ClauseClock — SLA Interval Splicer & Vendor Recovery
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  jira:globalPage:
    - key: clause-clock-global-portfolio
      resource: clause-clock-ui
      resolver:
        function: clause-clock-router
      title: ClauseClock Portfolio Settlement Studio

  rovo:agent:
    - key: clause-clock-rovo-agent
      name: ClauseClock SLA Agent
      description: Deterministic SLA interval splicer and upstream vendor penalty
        recovery auditor for Jira Service Management claims.
      prompt: >
        You are ClauseClock, a deterministic SLA Service Credit and Upstream
        Vendor Apportionment agent. Never estimate outage durations or dollar
        credits in prose. Always invoke evaluate-clause-clock or run-pbt-audit
        first, present the exact integer-minute interval waterfall and
        Largest-Remainder vendor split, require a human
        APPROVAL::<proposalVersionKey>::<approverId> token before invoking
        commit-credit-settlement, and append the [ClauseClock Receipt #...]
        footer verbatim.
      skills:
        - clause-clock-rovo-skill
      actions:
        - evaluate-clause-clock
        - run-pbt-audit
        - commit-credit-settlement
        - reset-settlement-state

  rovo:skill:
    - key: clause-clock-rovo-skill
      source:
        dir: skills/clause-clock
      dependencies:
        tools:
          - evaluate-clause-clock
          - run-pbt-audit
          - commit-credit-settlement
          - reset-settlement-state

  rovo:mcp:
    - key: clause-clock-mcp-server
      name: ClauseClock MCP Server
      tools:
        - evaluate-clause-clock
        - run-pbt-audit
        - commit-credit-settlement
        - reset-settlement-state

  action:
    - key: evaluate-clause-clock
      name: Evaluate ClauseClock SLA & Vendor Split
      function: clause-clock-router
      actionVerb: GET
      description: Computes Union(Incidents) minus Maintenance, clips to the contract
        billing month and timezone, applies SLA credit tiers and monthly caps,
        and apportions vendor recovery via Largest Remainder.
      inputs:
        scenarioId:
          title: Scenario
          type: string
          required: false
          description: Scenario
        timezoneOverride:
          title: Billing timezone
          type: string
          required: false
          description: Billing timezone
    - key: run-pbt-audit
      name: Run ClauseClock PBT Invariant Audit
      function: clause-clock-router
      actionVerb: GET
      description: Executes Property-Based Testing (P1..P4) against the
        Uint8Array(44640) discrete minute bitmap oracle and replays the naive
        spreadsheet counterexample.
      inputs:
        numRuns:
          title: Audit runs
          type: integer
          required: false
          description: Audit runs
        seed:
          title: Random seed
          type: integer
          required: false
          description: Random seed
    - key: commit-credit-settlement
      name: Commit Credit Settlement (Human Approval Gate)
      function: clause-clock-router
      actionVerb: CREATE
      description: Save the approved ledger and pending delivery atomically in KVS, then deliver Jira/JSM records and a realtime refresh event.
      inputs:
        scenarioId:
          title: Scenario
          type: string
          required: false
          description: Scenario
        timezoneOverride:
          title: Billing timezone
          type: string
          required: false
          description: Billing timezone
        expectedProposalVersionKey:
          title: Approved proposal
          type: string
          required: true
          description: Approved proposal
        approverId:
          title: Approver
          type: string
          required: true
          description: Approver
        approvalToken:
          title: Approval token
          type: string
          required: true
          description: Approval token
        financeOverrideReason:
          title: Draft override reason
          type: string
          required: false
          description: Draft override reason
    - key: reset-settlement-state
      name: Reset Settlement State (1-Click Rollback)
      function: clause-clock-router
      actionVerb: UPDATE
      description: Restores the claim and monthly cap ledger back to the
        pre-settlement READY state and broadcasts a @forge/realtime reset event.
      inputs:
        scenarioId:
          title: Scenario
          type: string
          required: false
          description: Scenario

  function:
    - key: clause-clock-router
      handler: index.routeClauseClockForgeAction

resources:
  - key: clause-clock-ui
    path: static/clause-clock-ui

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:graph:jira
    - read:servicedesk-request
    - write:servicedesk-request
    - storage:app
  content:
    styles:
      - unsafe-inline

app:
  package:
    bundler: manual@2026
    path: build/forge
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/00000000-0000-4000-8000-000000000000
  storage:
    entities:
      - name: clause-clock-account
        attributes:
          revision:
            type: integer
          snapshot:
            type: string
          pending:
            type: any
